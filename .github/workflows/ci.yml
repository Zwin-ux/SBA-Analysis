name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sba-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-quality:
    name: Data quality foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused test dependencies
        run: >-
          python -m pip install
          "pandas==2.3.3"
          "scikit-learn==1.9.0"
          "pytest>=8.3,<9"
          "pytest-cov>=6,<7"

      - name: Compile source
        run: python -m compileall -q src tests scripts

      - name: Run tests
        run: python -m pytest

      - name: Run public fixture pipeline
        run: python scripts/run_sample_pipeline.py
